<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronograma de Actividades 2026</title>
    <style>
        /* Reseteo básico */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0a0a0a;
            color: #f3e5f5;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .app-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .calendar-card {
            flex: 1;
            background-color: #140a21;
            border: 2px solid #381a59;
            border-radius: 0px; 
            display: flex;
            flex-direction: column;
            padding: 20px 30px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #fbc02d;
            padding-bottom: 15px;
        }

        h1 {
            font-size: 2.5rem;
            color: #fbc02d;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 10px;
        }

        h2 {
            font-size: 1.5rem;
            color: #ce93d8;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
            flex: 1;
            margin-top: 10px;
        }

        .weekday {
            font-weight: 700;
            color: #ce93d8;
            text-align: center;
            font-size: 1rem;
            text-transform: uppercase;
            padding-bottom: 10px;
        }

        .day {
            background-color: #1e122e;
            border: 1px solid #381a59;
            display: flex;
            flex-direction: column;
            padding: 8px;
            min-height: 120px;
            transition: border-color 0.2s ease, background-color 0.2s ease;
        }

        .day:not(.empty):focus-within {
            border-color: #fbc02d;
            background-color: #26163b;
        }

        .day.empty {
            background-color: transparent;
            border: none;
        }

        .day-number {
            align-self: flex-end;
            font-size: 1.1rem;
            font-weight: bold;
            color: #ce93d8;
            margin-bottom: 5px;
        }

        .day-note {
            flex: 1;
            width: 100%;
            background: transparent;
            border: none;
            resize: none;
            font-family: inherit;
            font-size: 0.95rem;
            color: #fbc02d; /* Texto en dorado para diferenciar lo que viene del Excel */
            outline: none;
            line-height: 1.4;
        }

        .day-note::placeholder {
            color: #593c75;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0 0 0;
            margin-top: 10px;
        }

        button {
            background-color: #4a148c;
            color: #fbc02d;
            border: 2px solid #4a148c;
            padding: 12px 30px;
            font-size: 1.1rem;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            transition: all 0.2s ease;
        }

        button:hover:not(:disabled) {
            background-color: #fbc02d;
            border-color: #fbc02d;
            color: #0a0a0a;
        }

        button:disabled {
            background-color: #2a1b3d;
            border-color: #2a1b3d;
            color: #593c75;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="calendar-card">
            <div class="header">
                <h1>Cronograma de Actividades</h1>
                <h2 id="month-title">Mes 2026</h2>
            </div>
            
            <div class="grid" id="days-grid"></div>
        </div>

        <div class="controls">
            <button id="btn-prev">Anterior</button>
            <button id="btn-next">Siguiente</button>
        </div>
    </div>

    <script>
        const year = 2026;
        const monthNames = [
            "Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", 
            "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"
        ];
        const dayNames = ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"];
        
        let currentMonth = 0;
        let excelData = {}; 

        const monthTitle = document.getElementById('month-title');
        const daysGrid = document.getElementById('days-grid');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');

        // Aquí está tu enlace oficial de Google Sheets
        const urlGoogleSheet = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRYzNtjM5TOM0X2fAUK_AQRmJlFwLzkXMYMlTAnBvTdrscNeVh0dBICOTISw12ARg/pub?output=csv'; 

        async function cargarDatosDeExcel() {
            try {
                const respuesta = await fetch(urlGoogleSheet);
                const datosCsv = await respuesta.text();
                
                const filas = datosCsv.split('\n').slice(1); 
                
                filas.forEach(fila => {
                    const columnas = fila.split(',');
                    if (columnas.length >= 2) {
                        const fecha = columnas[0].trim();
                        const texto = columnas.slice(1).join(',').trim(); 
                        
                        if (fecha !== '') {
                            excelData[fecha] = texto;
                        }
                    }
                });
                
                renderCalendar(currentMonth);

            } catch (error) {
                console.error("Error al cargar el Excel.", error);
                renderCalendar(currentMonth); 
            }
        }

        function renderCalendar(monthIndex) {
            monthTitle.textContent = `${monthNames[monthIndex]} ${year}`;
            daysGrid.innerHTML = '';

            dayNames.forEach(day => {
                const dayDiv = document.createElement('div');
                dayDiv.className = 'weekday';
                dayDiv.textContent = day;
                daysGrid.appendChild(dayDiv);
            });

            const firstDay = new Date(year, monthIndex, 1).getDay();
            const daysInMonth = new Date(year, monthIndex + 1, 0).getDate();

            for (let i = 0; i < firstDay; i++) {
                const emptyDiv = document.createElement('div');
                emptyDiv.className = 'day empty';
                daysGrid.appendChild(emptyDiv);
            }

            for (let i = 1; i <= daysInMonth; i++) {
                const dayDiv = document.createElement('div');
                dayDiv.className = 'day';

                const numSpan = document.createElement('span');
                numSpan.className = 'day-number';
                numSpan.textContent = i;

                const textArea = document.createElement('textarea');
                textArea.className = 'day-note';
                textArea.placeholder = 'Escribir...';

                // Clave de formato YYYY-MM-DD para cruzar con el Excel
                const mesFormateado = String(monthIndex + 1).padStart(2, '0');
                const diaFormateado = String(i).padStart(2, '0');
                const fechaKey = `${year}-${mesFormateado}-${diaFormateado}`;

                const storageKey = `nota-dark-2026-${monthIndex}-${i}`;
                
                // Si el Excel tiene datos para este día, muéstralo
                if (excelData[fechaKey]) {
                    textArea.value = excelData[fechaKey];
                } else {
                    // Si no, muestra lo que el usuario haya escrito manualmente
                    textArea.value = localStorage.getItem(storageKey) || '';
                }

                textArea.addEventListener('input', (e) => {
                    localStorage.setItem(storageKey, e.target.value);
                });

                dayDiv.appendChild(numSpan);
                dayDiv.appendChild(textArea);
                daysGrid.appendChild(dayDiv);
            }

            btnPrev.disabled = currentMonth === 0;
            btnNext.disabled = currentMonth === 11;
        }

        btnNext.addEventListener('click', () => {
            if (currentMonth < 11) {
                currentMonth++;
                renderCalendar(currentMonth);
            }
        });

        btnPrev.addEventListener('click', () => {
            if (currentMonth > 0) {
                currentMonth--;
                renderCalendar(currentMonth);
            }
        });

        cargarDatosDeExcel();
    </script>
</body>
</html>
