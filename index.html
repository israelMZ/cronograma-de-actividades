<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronograma de Actividades 2026</title>
    <style>
        /* Reseteo básico */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0a0a0a;
            color: #f3e5f5;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* Evita que la pantalla entera haga scroll */
        }

        .app-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 100%; /* Antes estaba en 1400px. Ahora toma TODO el ancho */
            margin: 0 auto;
            padding: 15px 25px; /* Reducimos padding para aprovechar más espacio */
        }

        .calendar-card {
            flex: 1;
            background-color: #140a21;
            border: 2px solid #381a59;
            border-radius: 0px; 
            display: flex;
            flex-direction: column;
            padding: 15px 20px;
            min-height: 0; /* Permite que el contenedor se adapte sin desbordar */
        }

        .header {
            text-align: center;
            margin-bottom: 10px;
            border-bottom: 2px solid #fbc02d;
            padding-bottom: 10px;
        }

        h1 {
            font-size: 2rem;
            color: #fbc02d;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 5px;
        }

        h2 {
            font-size: 1.3rem;
            color: #ce93d8;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            grid-auto-rows: 1fr; /* Hace que todas las semanas midan exactamente lo mismo y llenen el alto disponible */
            gap: 10px;
            flex: 1;
            margin-top: 10px;
            min-height: 0; /* Vital para que funcione flexbox hacia abajo */
        }

        .weekday {
            font-weight: 700;
            color: #ce93d8;
            text-align: center;
            font-size: 1rem;
            text-transform: uppercase;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 5px;
        }

        .day {
            background-color: #1e122e;
            border: 1px solid #381a59;
            display: flex;
            flex-direction: column;
            padding: 8px;
            min-height: 0; /* Quitado el límite mínimo para que se adapte a cualquier monitor */
            height: 100%;
            transition: border-color 0.2s ease, background-color 0.2s ease;
        }

        .day:not(.empty):focus-within {
            border-color: #fbc02d;
            background-color: #26163b;
        }

        .day.empty {
            background-color: transparent;
            border: none;
        }

        .day-number {
            align-self: flex-end;
            font-size: 1rem;
            font-weight: bold;
            color: #ce93d8;
            margin-bottom: 2px;
        }

        .day-note {
            flex: 1;
            width: 100%;
            background: transparent;
            border: none;
            resize: none;
            font-family: inherit;
            font-size: 0.82rem; 
            color: #fbc02d; 
            outline: none;
            line-height: 1.25; 
            padding-right: 5px; 
        }

        .day-note::placeholder {
            color: #593c75;
        }

        /* Barras de scroll elegantes */
        .day-note::-webkit-scrollbar {
            width: 6px; 
        }
        
        .day-note::-webkit-scrollbar-track {
            background: transparent; 
        }
        
        .day-note::-webkit-scrollbar-thumb {
            background-color: #381a59; 
            border-radius: 10px; 
        }
        
        .day-note::-webkit-scrollbar-thumb:hover {
            background-color: #ce93d8; 
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0 0 0;
        }

        button {
            background-color: #4a148c;
            color: #fbc02d;
            border: 2px solid #4a148c;
            padding: 10px 30px;
            font-size: 1.1rem;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            transition: all 0.2s ease;
        }

        button:hover:not(:disabled) {
            background-color: #fbc02d;
            border-color: #fbc02d;
            color: #0a0a0a;
        }

        button:disabled {
            background-color: #2a1b3d;
            border-color: #2a1b3d;
            color: #593c75;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="calendar-card">
            <div class="header">
                <h1>Cronograma de Actividades</h1>
                <h2 id="month-title">Mes 2026</h2>
            </div>
            
            <div class="grid" id="days-grid"></div>
        </div>

        <div class="controls">
            <button id="btn-prev">Anterior</button>
            <button id="btn-next">Siguiente</button>
        </div>
    </div>

    <script>
        const year = 2026;
        const monthNames = [
            "Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", 
            "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"
        ];
        const dayNames = ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"];
        
        let currentMonth = 0;
        let excelData = {}; 

        const urlGoogleSheet = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRYzNtjM5TOM0X2fAUK_AQRmJlFwLzkXMYMlTAnBvTdrscNeVh0dBICOTISw12ARg/pub?output=csv'; 

        const monthTitle = document.getElementById('month-title');
        const daysGrid = document.getElementById('days-grid');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');

        async function cargarDatosDeExcel() {
            try {
                const respuesta = await fetch(urlGoogleSheet);

                if (!respuesta.ok) {
                    throw new Error(`Error de red: ${respuesta.status}`);
                }

                const datosCsv = await respuesta.text();
                const filas = datosCsv.split(/\r?\n/).slice(1); 
                
                filas.forEach(fila => {
                    if (!fila.trim()) return; 

                    const indiceComa = fila.indexOf(',');
                    if (indiceComa > -1) {
                        let fechaCruda = fila.substring(0, indiceComa).trim();
                        let texto = fila.substring(indiceComa + 1).trim(); 
                        
                        if (texto.startsWith('"') && texto.endsWith('"')) {
                            texto = texto.substring(1, texto.length - 1);
                        }
                        
                        let fechaLista = fechaCruda;

                        if (fechaCruda.includes('/')) {
                            const partes = fechaCruda.split('/');
                            if (partes.length === 3) {
                                const dia = partes[0].padStart(2, '0');
                                const mes = partes[1].padStart(2, '0');
                                const anio = partes[2];
                                fechaLista = `${anio}-${mes}-${dia}`;
                            }
                        }
                        
                        if (fechaLista !== '') {
                            excelData[fechaLista] = texto;
                        }
                    }
                });
                
                renderCalendar(currentMonth);

            } catch (error) {
                console.error("Fallo al cargar el Excel:", error);
                renderCalendar(currentMonth); 
            }
        }

        function renderCalendar(monthIndex) {
            monthTitle.textContent = `${monthNames[monthIndex]} ${year}`;
            daysGrid.innerHTML = '';

            // Renderizar nombres de los días y empaquetarlos en otra capa CSS para cuadrar exacto
            dayNames.forEach(day => {
                const dayDiv = document.createElement('div');
                dayDiv.className = 'weekday';
                dayDiv.textContent = day;
                daysGrid.appendChild(dayDiv);
            });

            const firstDay = new Date(year, monthIndex, 1).getDay();
            const daysInMonth = new Date(year, monthIndex + 1, 0).getDate();

            for (let i = 0; i < firstDay; i++) {
                const emptyDiv = document.createElement('div');
                emptyDiv.className = 'day empty';
                daysGrid.appendChild(emptyDiv);
            }

            for (let i = 1; i <= daysInMonth; i++) {
                const dayDiv = document.createElement('div');
                dayDiv.className = 'day';

                const numSpan = document.createElement('span');
                numSpan.className = 'day-number';
                numSpan.textContent = i;

                const textArea = document.createElement('textarea');
                textArea.className = 'day-note';
                textArea.placeholder = 'Escribir...';

                const mesFormateado = String(monthIndex + 1).padStart(2, '0');
                const diaFormateado = String(i).padStart(2, '0');
                const fechaKey = `${year}-${mesFormateado}-${diaFormateado}`;

                const storageKey = `nota-dark-2026-${monthIndex}-${i}`;
                
                if (excelData[fechaKey]) {
                    textArea.value = excelData[fechaKey];
                } else {
                    textArea.value = localStorage.getItem(storageKey) || '';
                }

                textArea.addEventListener('input', (e) => {
                    localStorage.setItem(storageKey, e.target.value);
                });

                dayDiv.appendChild(numSpan);
                dayDiv.appendChild(textArea);
                daysGrid.appendChild(dayDiv);
            }

            btnPrev.disabled = currentMonth === 0;
            btnNext.disabled = currentMonth === 11;
        }

        btnNext.addEventListener('click', () => {
            if (currentMonth < 11) {
                currentMonth++;
                renderCalendar(currentMonth);
            }
        });

        btnPrev.addEventListener('click', () => {
            if (currentMonth > 0) {
                currentMonth--;
                renderCalendar(currentMonth);
            }
        });

        cargarDatosDeExcel();
    </script>
</body>
</html>
