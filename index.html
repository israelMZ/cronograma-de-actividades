<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronograma de Actividades 2026</title>
    <style>
        /* Reseteo básico */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0a0a0a;
            color: #f3e5f5;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden; 
        }

        .app-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 100%; 
            margin: 0 auto;
            padding: 15px 25px; 
        }

        .calendar-card {
            flex: 1;
            background-color: #140a21;
            border: 2px solid #381a59;
            border-radius: 0px; 
            display: flex;
            flex-direction: column;
            padding: 15px 20px;
            min-height: 0; 
        }

        .header {
            text-align: center;
            margin-bottom: 10px;
            border-bottom: 2px solid #fbc02d;
            padding-bottom: 10px;
        }

        h1 {
            font-size: 2rem;
            color: #fbc02d;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 5px;
        }

        h2 {
            font-size: 1.3rem;
            color: #ce93d8;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            grid-auto-rows: 1fr; 
            gap: 10px;
            flex: 1;
            margin-top: 10px;
            min-height: 0; 
        }

        .weekday {
            font-weight: 700;
            color: #ce93d8;
            text-align: center;
            font-size: 1rem;
            text-transform: uppercase;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 5px;
        }

        .day {
            background-color: #1e122e;
            border: 1px solid #381a59;
            display: flex;
            flex-direction: column;
            padding: 8px;
            min-height: 0; 
            height: 100%;
            transition: border-color 0.2s ease, background-color 0.2s ease;
        }

        .day:not(.empty):focus-within {
            border-color: #fbc02d;
            background-color: #26163b;
        }

        .day.empty {
            background-color: transparent;
            border: none;
        }

        .day-number {
            align-self: flex-end;
            font-size: 1rem;
            font-weight: bold;
            color: #ce93d8;
            margin-bottom: 2px;
        }

        .day-note {
            flex: 1;
            width: 100%;
            background: transparent;
            border: none;
            resize: none;
            font-family: inherit;
            font-size: 0.80rem; 
            color: #fbc02d; 
            outline: none;
            line-height: 1.35; /* Un poco más de espacio entre líneas para las listas */
            padding-right: 5px; 
            font-weight: 500;
        }

        .day-note::placeholder {
            color: #593c75;
            font-weight: normal;
        }

        .day-note::-webkit-scrollbar {
            width: 6px; 
        }
        .day-note::-webkit-scrollbar-track {
            background: transparent; 
        }
        .day-note::-webkit-scrollbar-thumb {
            background-color: #381a59; 
            border-radius: 10px; 
        }
        .day-note::-webkit-scrollbar-thumb:hover {
            background-color: #ce93d8; 
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0 0 0;
        }

        button {
            background-color: #4a148c;
            color: #fbc02d;
            border: 2px solid #4a148c;
            padding: 10px 30px;
            font-size: 1.1rem;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            transition: all 0.2s ease;
        }

        button:hover:not(:disabled) {
            background-color: #fbc02d;
            border-color: #fbc02d;
            color: #0a0a0a;
        }

        button:disabled {
            background-color: #2a1b3d;
            border-color: #2a1b3d;
            color: #593c75;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="calendar-card">
            <div class="header">
                <h1>Cronograma de Actividades</h1>
                <h2 id="month-title">Mes 2026</h2>
            </div>
            
            <div class="grid" id="days-grid"></div>
        </div>

        <div class="controls">
            <button id="btn-prev">Anterior</button>
            <button id="btn-next">Siguiente</button>
        </div>
    </div>

    <script>
        const year = 2026;
        const monthNames = [
            "Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", 
            "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"
        ];
        const dayNames = ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"];
        
        let currentMonth = 0;
        let excelData = {}; 

        const urlGoogleSheet = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRYzNtjM5TOM0X2fAUK_AQRmJlFwLzkXMYMlTAnBvTdrscNeVh0dBICOTISw12ARg/pub?output=csv'; 

        const monthTitle = document.getElementById('month-title');
        const daysGrid = document.getElementById('days-grid');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');

        // Lector avanzado que entiende saltos de línea y celdas complejas
        function parsearCSVCompleto(texto) {
            let resultado = [];
            let filaActual = [];
            let valorActual = '';
            let entreComillas = false;

            for (let i = 0; i < texto.length; i++) {
                let char = texto[i];
                let sigChar = texto[i + 1];

                if (char === '"' && entreComillas && sigChar === '"') {
                    valorActual += '"';
                    i++; 
                } else if (char === '"') {
                    entreComillas = !entreComillas;
                } else if (char === ',' && !entreComillas) {
                    filaActual.push(valorActual);
                    valorActual = '';
                } else if ((char === '\n' || (char === '\r' && sigChar === '\n')) && !entreComillas) {
                    filaActual.push(valorActual);
                    resultado.push(filaActual);
                    filaActual = [];
                    valorActual = '';
                    if (char === '\r') i++;
                } else {
                    valorActual += char;
                }
            }
            if (valorActual !== '' || filaActual.length > 0) {
                filaActual.push(valorActual);
                resultado.push(filaActual);
            }
            return resultado;
        }

        async function cargarDatosDeExcel() {
            try {
                const respuesta = await fetch(urlGoogleSheet);

                if (!respuesta.ok) {
                    throw new Error(`Error de red: ${respuesta.status}`);
                }

                const datosCsv = await respuesta.text();
                const filas = parsearCSVCompleto(datosCsv).slice(1); 
                
                filas.forEach(columnas => {
                    if (columnas.length >= 2) {
                        let fechaCruda = columnas[0].trim();
                        let textoCrudo = columnas[1].trim(); 
                        let color = columnas[2] ? columnas[2].trim() : ""; 
                        
                        // Si el texto trae comillas extrañas al inicio y final por el CSV, las quitamos
                        if (textoCrudo.startsWith('"') && textoCrudo.endsWith('"')) {
                            textoCrudo = textoCrudo.substring(1, textoCrudo.length - 1);
                        }
                        
                        // MAGIA DE FORMATO: Separador de actividades
                        // Reemplaza 3 o más espacios seguidos por un salto de línea real
                        let textoLimpio = textoCrudo.replace(/\s{3,}/g, '\n');
                        
                        // Convierte todo en una lista con viñetas
                        let actividades = textoLimpio.split('\n');
                        let textoFinal = actividades
                            .map(act => act.trim())
                            .filter(act => act.length > 0)
                            .map(act => '• ' + act)
                            .join('\n'); // Une cada actividad con un salto de renglón

                        let fechaLista = fechaCruda;

                        if (fechaCruda.includes('/')) {
                            const partes = fechaCruda.split('/');
                            if (partes.length === 3) {
                                const dia = partes[0].padStart(2, '0');
                                const mes = partes[1].padStart(2, '0');
                                const anio = partes[2];
                                fechaLista = `${anio}-${mes}-${dia}`;
                            }
                        }
                        
                        if (fechaLista !== '') {
                            excelData[fechaLista] = { texto: textoFinal, color: color };
                        }
                    }
                });
                
                renderCalendar(currentMonth);

            } catch (error) {
                console.error("Fallo al cargar el Excel:", error);
                renderCalendar(currentMonth); 
            }
        }

        function renderCalendar(monthIndex) {
            monthTitle.textContent = `${monthNames[monthIndex]} ${year}`;
            daysGrid.innerHTML = '';

            dayNames.forEach(day => {
                const dayDiv = document.createElement('div');
                dayDiv.className = 'weekday';
                dayDiv.textContent = day;
                daysGrid.appendChild(dayDiv);
            });

            const firstDay = new Date(year, monthIndex, 1).getDay();
            const daysInMonth = new Date(year, monthIndex + 1, 0).getDate();

            for (let i = 0; i < firstDay; i++) {
                const emptyDiv = document.createElement('div');
                emptyDiv.className = 'day empty';
                daysGrid.appendChild(emptyDiv);
            }

            for (let i = 1; i <= daysInMonth; i++) {
                const dayDiv = document.createElement('div');
                dayDiv.className = 'day';

                const numSpan = document.createElement('span');
                numSpan.className = 'day-number';
                numSpan.textContent = i;

                const textArea = document.createElement('textarea');
                textArea.className = 'day-note';
                textArea.placeholder = 'Escribir...';

                const mesFormateado = String(monthIndex + 1).padStart(2, '0');
                const diaFormateado = String(i).padStart(2, '0');
                const fechaKey = `${year}-${mesFormateado}-${diaFormateado}`;

                const storageKey = `nota-dark-2026-${monthIndex}-${i}`;
                
                if (excelData[fechaKey]) {
                    textArea.value = excelData[fechaKey].texto;
                    
                    let colorAsignado = excelData[fechaKey].color.toLowerCase();
                    if (colorAsignado === 'rojo' || colorAsignado === 'red') {
                        textArea.style.color = '#ff4d4d'; 
                    } else if (colorAsignado !== '') {
                        textArea.style.color = colorAsignado; 
                    } else {
                        textArea.style.color = '#fbc02d'; 
                    }

                } else {
                    textArea.value = localStorage.getItem(storageKey) || '';
                    textArea.style.color = '#fbc02d'; 
                }

                textArea.addEventListener('input', (e) => {
                    localStorage.setItem(storageKey, e.target.value);
                });

                dayDiv.appendChild(numSpan);
                dayDiv.appendChild(textArea);
                daysGrid.appendChild(dayDiv);
            }

            btnPrev.disabled = currentMonth === 0;
            btnNext.disabled = currentMonth === 11;
        }

        btnNext.addEventListener('click', () => {
            if (currentMonth < 11) {
                currentMonth++;
                renderCalendar(currentMonth);
            }
        });

        btnPrev.addEventListener('click', () => {
            if (currentMonth > 0) {
                currentMonth--;
                renderCalendar(currentMonth);
            }
        });

        cargarDatosDeExcel();
    </script>
</body>
</html>
